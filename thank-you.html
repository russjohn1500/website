<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Civil & Structural Engineering</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .thank-you-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 60px 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }

    .thank-you-icon {
      width: 80px;
      height: 80px;
      background: #667eea;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      font-size: 40px;
    }

    h1 {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .thank-you-message {
      font-size: 1.1rem;
      color: #666;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .highlight {
      color: #667eea;
      font-weight: 600;
    }

    .back-button {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px 50px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      color: white;
      text-decoration: none;
    }

    .back-button:active {
      transform: translateY(0);
    }

    .footer-text {
      margin-top: 50px;
      padding-top: 30px;
      border-top: 1px solid #eee;
      font-size: 0.9rem;
      color: #999;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .thank-you-container {
        padding: 40px 30px;
      }

      h1 {
        font-size: 2rem;
      }

      .thank-you-message {
        font-size: 1rem;
      }

      .back-button {
        padding: 12px 40px;
        font-size: 0.95rem;
      }

      .thank-you-icon {
        width: 70px;
        height: 70px;
        font-size: 35px;
        margin-bottom: 25px;
      }
    }

    @media (max-width: 480px) {
      .thank-you-container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 1.75rem;
        margin-bottom: 12px;
      }

      .thank-you-message {
        font-size: 0.95rem;
        margin-bottom: 30px;
      }

      .back-button {
        padding: 12px 35px;
        font-size: 0.9rem;
      }

      .footer-text {
        margin-top: 30px;
        padding-top: 20px;
        font-size: 0.85rem;
      }

      .thank-you-icon {
        width: 60px;
        height: 60px;
        font-size: 30px;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="thank-you-container">
    <div class="thank-you-icon">✓</div>
    <h1>Thank You!</h1>
    <p class="thank-you-message">
      We've received your message and appreciate you reaching out. Our team will review your inquiry and get back to you as soon as possible.
    </p>
    <a href="/" class="back-button">Return to Home</a>
    <div class="footer-text">
      <p>If you need immediate assistance, please call us or visit our office in Mesa, Arizona.</p>
    </div>
  </div>
</body>
</html>
